# Profile test: chạy bằng H2 in-memory, không cần PostgreSQL/Docker.
# Flyway tắt vì migration hiện tại dùng cú pháp riêng của PostgreSQL (plpgsql, jsonb...).
# Hibernate tự tạo schema từ entity để test context load và các unit test.
spring.datasource.url=jdbc:h2:mem:pallet_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=false

# Cấu hình riêng cho test
app.jwt.secret=pallet-test-only-secret-key-0123456789abcdef-pallet-test
app.cors.allowed-origins=http://localhost:5173
app.upload-dir=target/test-uploads
