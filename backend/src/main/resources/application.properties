# Đọc thêm file .env (nếu có) khi chạy backend từ thư mục backend/.
# Nhờ vậy chỉ cần copy .env.example -> .env là cả Docker lẫn Spring dùng chung cấu hình.
spring.config.import=optional:file:.env[.properties]

# DataSource - override bằng biến môi trường khi deploy.
# Giá trị mặc định chỉ dành cho môi trường dev cục bộ (khớp docker-compose.yml).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pallet_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# JWT - BẮT BUỘC đặt JWT_SECRET khi chạy production.
app.jwt.secret=${JWT_SECRET:pallet-dev-only-secret-please-change-in-production-0123456789abcdef}
app.jwt.access-token-expiration-minutes=${JWT_ACCESS_MINUTES:60}
app.jwt.refresh-token-expiration-days=${JWT_REFRESH_DAYS:7}

# CORS - danh sách origin cách nhau bởi dấu phẩy
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Upload ảnh sản phẩm
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
