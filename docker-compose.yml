version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: pallet_postgres
    restart: always
    environment:
      POSTGRES_DB: pallet_db
      POSTGRES_USER: bao
      POSTGRES_PASSWORD: 30102006
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pallet_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres-db

volumes:
  postgres_data: